name: Bark
options:
  bundleIdPrefix: se.lab37.bark
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Bark Dev"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Bark:
    type: application
    platform: macOS
    sources:
      - Bark
    dependencies:
      - package: WhisperKit
      - package: Sparkle
    postBuildScripts:
      - name: Deep re-sign with Bark Dev (stabilize TCC grants across rebuilds)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            /usr/bin/codesign --force --deep --sign "Bark Dev" \
              "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}" || true
          fi
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
    info:
      path: Bark/Info.plist
      properties:
        LSUIElement: YES
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Bark captures your voice for local, on-device transcription. Audio never leaves your Mac."
        NSHumanReadableCopyright: "© LAB37"
        CFBundleDisplayName: Bark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://delarc0.github.io/bark-mac/appcast.xml
        SUPublicEDKey: "xLy1zhCVvHlYyI1wHQyPWk67NxoP/u7vvPfMFe8joEY="
        SUEnableInstallerLauncherService: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.lab37.bark.mac
        PRODUCT_NAME: Bark
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Bark/Bark.entitlements
        ENABLE_APP_SANDBOX: NO
