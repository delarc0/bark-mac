name: Bark
options:
  bundleIdPrefix: se.lab37.bark
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Ad-hoc by default so a clean checkout builds on any Mac. install.sh
    # upgrades this to the optional self-signed "Bark Dev" identity when present
    # (that keeps TCC grants stable across rebuilds — see scripts/create-signing-cert.sh).
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Bark:
    type: application
    platform: macOS
    sources:
      - Bark
    dependencies:
      - package: WhisperKit
      - package: Sparkle
    postBuildScripts:
      - name: Deep re-sign (unify Team IDs; stabilize TCC grants across rebuilds)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            # The app compiles ad-hoc so the SPM dependency targets never demand
            # a development team. This deep re-sign unifies every nested dylib
            # under one identity (fixes the Team-ID-mismatch load crash) and, when
            # install.sh passes BARK_SIGN_IDENTITY="Bark Dev", upgrades to the
            # self-signed cert so TCC grants survive rebuilds. Falls back to ad-hoc.
            IDENTITY="${BARK_SIGN_IDENTITY:-${EXPANDED_CODE_SIGN_IDENTITY_NAME:--}}"
            /usr/bin/codesign --force --deep --sign "$IDENTITY" \
              "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}" || true
          fi
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
    info:
      path: Bark/Info.plist
      properties:
        LSUIElement: YES
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Bark captures your voice for local, on-device transcription. Audio never leaves your Mac."
        NSHumanReadableCopyright: "© LAB37"
        CFBundleDisplayName: Bark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://delarc0.github.io/bark-mac/appcast.xml
        SUPublicEDKey: "xLy1zhCVvHlYyI1wHQyPWk67NxoP/u7vvPfMFe8joEY="
        SUEnableInstallerLauncherService: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.lab37.bark.mac
        PRODUCT_NAME: Bark
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Bark/Bark.entitlements
        ENABLE_APP_SANDBOX: NO
