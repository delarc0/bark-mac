name: Bark
options:
  bundleIdPrefix: se.lab37.bark
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Bark:
    type: application
    platform: macOS
    sources:
      - Bark
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.lab37.bark.mac
        PRODUCT_NAME: Bark
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bark captures your voice for local, on-device transcription. Audio never leaves your Mac."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© LAB37"
        CODE_SIGN_ENTITLEMENTS: Bark/Bark.entitlements
        ENABLE_APP_SANDBOX: NO
