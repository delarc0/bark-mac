name: Bark
options:
  bundleIdPrefix: se.lab37.bark
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  BarkKit:
    path: BarkKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Ad-hoc by default so a clean checkout builds on any Mac; the post-build re-sign below can
    # upgrade to the optional self-signed "Bark Dev" identity (scripts/create-signing-cert.sh).
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Bark:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/silero-vad
      # A folder reference: the compiled model is copied as is, never recompiled.
      - path: App/Resources/silero-vad
        type: folder
        buildPhase: resources
    dependencies:
      - package: BarkKit
        product: BarkCore
      - package: BarkKit
        product: BarkEngine
      - package: BarkKit
        product: BarkCapture
      - package: Sparkle
    postBuildScripts:
      - name: Deep re-sign (unify Team IDs; stabilize TCC grants across rebuilds)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            # The app compiles ad-hoc so the SPM targets never demand a development team. This
            # re-sign unifies every nested binary under one identity (a Team ID mismatch crashes
            # at load) and, given BARK_SIGN_IDENTITY="Bark Dev", keeps TCC grants across rebuilds.
            IDENTITY="${BARK_SIGN_IDENTITY:-${EXPANDED_CODE_SIGN_IDENTITY_NAME:--}}"
            /usr/bin/codesign --force --deep --sign "$IDENTITY" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}" || true
          fi
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        LSUIElement: YES
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: "Bark captures your voice for local, on-device transcription. Audio never leaves your Mac."
        NSAudioCaptureUsageDescription: "Bark records the other side of a call to transcribe it on this Mac."
        NSHumanReadableCopyright: "© LAB37"
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(BARK_FEED_URL)
        SUPublicEDKey: "xLy1zhCVvHlYyI1wHQyPWk67NxoP/u7vvPfMFe8joEY="
        SUEnableInstallerLauncherService: NO
        # bark://hq-connected is hq's pairing callback (tasks/bark-hq-api.md).
        CFBundleURLTypes:
          - CFBundleURLName: se.lab37.bark.hq
            CFBundleURLSchemes: [bark]
    settings:
      base:
        PRODUCT_MODULE_NAME: Bark
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Bark.entitlements
        ENABLE_APP_SANDBOX: NO
      configs:
        # Runs beside the shipping Bark: own name, bundle id, UserDefaults domain and TCC grants.
        Debug:
          PRODUCT_NAME: Bark Dev
          PRODUCT_BUNDLE_IDENTIFIER: se.lab37.bark.mac.dev
          BARK_FEED_URL: ""
        Release:
          PRODUCT_NAME: Bark
          PRODUCT_BUNDLE_IDENTIFIER: se.lab37.bark.mac
          BARK_FEED_URL: https://delarc0.github.io/bark-mac/appcast.xml
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: SPARKLE
